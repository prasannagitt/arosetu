# Netlify Build Configuration for AroSetu Frontend
# This deploys only the React frontend as a static site

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "frontend/dist"

# SPA redirect — all routes serve index.html (React Router handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
